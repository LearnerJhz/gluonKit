[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gluonkit"
version = "0.1.0"
description = "Command-line tools for developing Gluon GPU kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "triton==3.8.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gk = "gluonkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_gpu: requires NVIDIA GPU access and torch/Triton"]
